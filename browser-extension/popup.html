<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>LinkVault</title>
<style>
  body {
    width: 300px;
    margin: 0;
    padding: 14px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #111827;
    background: #ffffff;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    font-weight: 600;
    font-size: 14px;
  }
  .header img {
    width: 20px;
    height: 20px;
    border-radius: 4px;
  }
  .hidden {
    display: none;
  }
  #page-title {
    margin: 0 0 2px;
    font-size: 13px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #page-url {
    margin: 0 0 10px;
    font-size: 11px;
    color: #6b7280;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  textarea {
    width: 100%;
    box-sizing: border-box;
    resize: vertical;
    min-height: 44px;
    font-family: inherit;
    font-size: 12px;
    padding: 6px 8px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    margin-bottom: 8px;
  }
  button {
    width: 100%;
    padding: 8px;
    border: none;
    border-radius: 6px;
    background: #111827;
    color: #ffffff;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  button:hover:not(:disabled) {
    background: #1f2937;
  }
  #status {
    margin: 8px 0 0;
    font-size: 12px;
    color: #6b7280;
    min-height: 14px;
  }
  #unconfigured p {
    font-size: 13px;
    color: #374151;
  }
</style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="" />
    <span>LinkVault</span>
  </div>

  <div id="unconfigured" class="hidden">
    <p>Not set up yet — add your LinkVault deployment URL and API token.</p>
    <button id="open-options">Open options</button>
  </div>

  <div id="form">
    <p id="page-title"></p>
    <p id="page-url"></p>
    <textarea id="note" placeholder="Add a note (optional)"></textarea>
    <button id="save">Save to LinkVault</button>
    <p id="status"></p>
  </div>

  <script src="api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
