<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>LinkVault settings</title>
<style>
  body {
    max-width: 420px;
    margin: 40px auto;
    padding: 0 20px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #111827;
  }
  h1 {
    font-size: 18px;
    margin-bottom: 4px;
  }
  p.hint {
    font-size: 13px;
    color: #6b7280;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin: 16px 0 4px;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    font-size: 13px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
  }
  button {
    margin-top: 18px;
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    background: #111827;
    color: #ffffff;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover {
    background: #1f2937;
  }
  #status {
    margin-top: 10px;
    font-size: 13px;
    color: #374151;
  }
</style>
</head>
<body>
  <h1>LinkVault settings</h1>
  <p class="hint">
    Generate a token from your LinkVault deployment's <strong>Settings</strong> page
    (the same one used for the iOS Shortcut), then paste it below.
  </p>

  <label for="baseUrl">Deployment URL</label>
  <input id="baseUrl" type="url" placeholder="https://your-app.vercel.app" />

  <label for="token">API token</label>
  <input id="token" type="password" placeholder="lv_..." autocomplete="off" />

  <button id="save">Save</button>
  <p id="status"></p>

  <script src="options.js"></script>
</body>
</html>
